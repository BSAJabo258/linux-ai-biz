#!/usr/sbin/nft -f
# BAU host firewall: default-deny inbound, allow outbound (spec §52, §98).
# Nothing listens for the outside world. To expose a service, add an explicit
# rule here and record why in BAU_SECURITY_MODEL.md.
flush ruleset

table inet bau {
  chain input {
    type filter hook input priority filter; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    # IPv6 needs ICMPv6 for neighbour discovery / path MTU.
    meta l4proto ipv6-icmp icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, packet-too-big, time-exceeded, parameter-problem, echo-request } accept
    meta l4proto icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
    # DHCPv4/v6 client replies.
    udp sport 67 udp dport 68 accept
    udp sport 547 udp dport 546 accept
    # Cloud server only (install.sh --cloud): SSH is the one way in. sshd takes keys only
    # (installer/cloud/prepare.sh); Jarvis and Mission Control stay on 127.0.0.1 and are
    # reached through an SSH tunnel. New connections are rate-limited.
    tcp dport 22 ct state new limit rate 15/minute accept comment "BAU cloud: SSH, key login only"
    counter comment "dropped inbound"
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
  }
  chain output {
    type filter hook output priority filter; policy accept;
  }
}
