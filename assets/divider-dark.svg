<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 24" width="1280" height="24"
     role="img" aria-labelledby="t">
<title id="t">section divider</title>
<defs><linearGradient id="g" x1="0" x2="1">
  <stop offset="0" stop-color="#3fd6ff" stop-opacity="0"/>
  <stop offset=".5" stop-color="#ffcf4d"/>
  <stop offset="1" stop-color="#3fd6ff" stop-opacity="0"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0"
                    dur="5s" repeatCount="indefinite"/></linearGradient></defs>
<style>@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<rect x="0" y="11" width="1280" height="1" fill="#3fd6ff" opacity=".25"/>
<rect x="0" y="10" width="1280" height="3" rx="1.5" fill="url(#g)"/>
<circle cx="640" cy="12" r="4" fill="#ffcf4d"/>
</svg>
