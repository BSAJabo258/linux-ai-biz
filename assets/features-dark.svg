<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-labelledby="t d">
<title id="t">What BAU does</title>
<desc id="d">Six features: Jarvis, compliance engine, human-only approvals, video studio,
toolbox and Repo Scout, and running on hardware you own.</desc>
<style>
.card { animation: rise 4.5s ease-in-out infinite; }
@keyframes rise { 50% { opacity: .86; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <radialGradient id="sky" cx="50%" cy="45%" r="75%">
    <stop offset="0" stop-color="#0b4374"/><stop offset=".55" stop-color="#03152c"/>
    <stop offset="1" stop-color="#010812"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#3fd6ff" stroke-width="1"
          opacity="0.07"/></pattern>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#3fd6ff" stop-opacity=".55"/>
    <stop offset="1" stop-color="#3fd6ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="title" x1="0" x2="1">
    <stop offset="0" stop-color="#e8f8ff"/><stop offset=".5" stop-color="#3fd6ff"/>
    <stop offset="1" stop-color="#ffcf4d"/></linearGradient>
</defs>
<rect width="1280" height="520" rx="18" fill="url(#sky)"/>
<rect width="1280" height="520" rx="18" fill="url(#grid)"/>
<g font-family="Rajdhani, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<g class="card" style="animation-delay:0.00s">
  <rect x="28.0" y="34" width="392" height="214" rx="14" fill="#061624"
