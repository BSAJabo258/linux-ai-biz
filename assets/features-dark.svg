  <path d="M496.0 76l16 6v10c0 11-7 18-16 22-9-4-16-11-16-22v-10z" fill="none" stroke="#3fd6ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.0 96l5 5 9-10" fill="none" stroke="#ffcf4d" stroke-width="2.4" stroke-linecap="round"/>
  <text x="538.0" y="104" font-size="21" font-weight="700" letter-spacing="2.5"
        fill="#e8f8ff">COMPLIANCE</text>
  <text x="472.0" y="168" font-size="17.5" fill="#7fa8bf">49 regulations, 65 policies.</text>
  <text x="472.0" y="196" font-size="17.5" fill="#7fa8bf">PASS, REVIEW or BLOCK + evidence.</text>
</g>
<g class="card" style="animation-delay:0.70s">
