  <circle cx="904.0" cy="96" r="9" fill="none" stroke="#3fd6ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M913.0 96h20m-6 0v7m-6-7v5" fill="none" stroke="#3fd6ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="904.0" cy="96" r="3" fill="#ffcf4d"/>
  <text x="954.0" y="104" font-size="21" font-weight="700" letter-spacing="2.5"
