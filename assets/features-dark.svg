  <circle cx="492.0" cy="330" r="13" fill="none" stroke="#3fd6ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M502.0 340l11 11" fill="none" stroke="#3fd6ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M486.0 330h12" stroke="#ffcf4d" stroke-width="2.4" stroke-linecap="round"/>
  <text x="538.0" y="342" font-size="21" font-weight="700" letter-spacing="2.5"
