  <text x="472.0" y="406" font-size="17.5" fill="#7fa8bf">77 researched open-source tools,</text>
  <text x="472.0" y="434" font-size="17.5" fill="#7fa8bf">inspected in quarantine first.</text>
</g>
<g class="card" style="animation-delay:1.75s">
  <rect x="860.0" y="272" width="392" height="214" rx="14" fill="#061624"
        fill-opacity="0.72" stroke="#3fd6ff" stroke-opacity=".35"/>
  <path d="M874.0 272h70" stroke="#ffcf4d" stroke-width="3" stroke-linecap="round"/>
  <path d="M1222.0 486h16" stroke="#3fd6ff" stroke-width="3"
        stroke-linecap="round"/>
  <rect x="894.0" y="316" width="36" height="14" rx="3" fill="none" stroke="#3fd6ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="894.0" y="336" width="36" height="14" rx="3" fill="none" stroke="#3fd6ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="922.0" cy="323" r="2.5" fill="#ffcf4d"/><circle cx="922.0" cy="343" r="2.5" fill="#ffcf4d"/>
  <text x="954.0" y="342" font-size="21" font-weight="700" letter-spacing="2.5"
