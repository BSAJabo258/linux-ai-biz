  <text x="888.0" y="168" font-size="17.5" fill="#7fa8bf">Money, legal, email: SSH-signed</text>
  <text x="888.0" y="196" font-size="17.5" fill="#7fa8bf">by you. Never by a model.</text>
</g>
<g class="card" style="animation-delay:1.05s">
