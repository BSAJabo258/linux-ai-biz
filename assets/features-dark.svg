  <text x="888.0" y="406" font-size="17.5" fill="#7fa8bf">Encrypted laptop, live USB, or</text>
  <text x="888.0" y="434" font-size="17.5" fill="#7fa8bf">your own cloud via SSH tunnel.</text>
