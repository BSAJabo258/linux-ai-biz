  <rect x="60.0" y="319" width="40" height="30" rx="5" fill="none" stroke="#3fd6ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M75.0 326l12 8-12 8z" fill="#ffcf4d"/>
  <text x="122.0" y="342" font-size="21" font-weight="700" letter-spacing="2.5"
        fill="#e8f8ff">VIDEO STUDIO</text>
  <text x="56.0" y="406" font-size="17.5" fill="#7fa8bf">AI clips priced before they're</text>
  <text x="56.0" y="434" font-size="17.5" fill="#7fa8bf">made, inside your own budget.</text>
</g>
<g class="card" style="animation-delay:1.40s">
  <rect x="444.0" y="272" width="392" height="214" rx="14" fill="#061624"
