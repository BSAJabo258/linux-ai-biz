  <text x="122.0" y="104" font-size="21" font-weight="700" letter-spacing="2.5"
        fill="#e8f8ff">JARVIS</text>
  <text x="56.0" y="168" font-size="17.5" fill="#7fa8bf">Voice-first assistant, live HUD.</text>
  <text x="56.0" y="196" font-size="17.5" fill="#7fa8bf">He stages actions; you confirm.</text>
</g>
<g class="card" style="animation-delay:0.35s">
  <rect x="444.0" y="34" width="392" height="214" rx="14" fill="#061624"
