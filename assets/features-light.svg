  <text x="472.0" y="168" font-size="17.5" fill="#3f5f72">49 regulations, 65 policies.</text>
  <text x="472.0" y="196" font-size="17.5" fill="#3f5f72">PASS, REVIEW or BLOCK + evidence.</text>
