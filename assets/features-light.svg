  <text x="122.0" y="104" font-size="21" font-weight="700" letter-spacing="2.5"
        fill="#08263a">JARVIS</text>
  <text x="56.0" y="168" font-size="17.5" fill="#3f5f72">Voice-first assistant with a glass</text>
  <text x="56.0" y="196" font-size="17.5" fill="#3f5f72">core; lean and fast on local models.</text>
</g>
