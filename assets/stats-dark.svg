<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1280 210" width="1280" height="210" role="img" aria-labelledby="t d">
<title id="t">BAU in numbers</title>
<desc id="d">49 regulations tracked, 65 policy rules,
77 researched tools, 4 story formats, 0 approvals by AI.</desc>
<style>
.tile { animation: glow 4s ease-in-out infinite; }
@keyframes glow { 50% { opacity: .82; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <radialGradient id="sky" cx="50%" cy="45%" r="75%">
    <stop offset="0" stop-color="#0b4374"/><stop offset=".55" stop-color="#03152c"/>
    <stop offset="1" stop-color="#010812"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#3fd6ff" stroke-width="1"
          opacity="0.07"/></pattern>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#3fd6ff" stop-opacity=".55"/>
    <stop offset="1" stop-color="#3fd6ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="title" x1="0" x2="1">
    <stop offset="0" stop-color="#e8f8ff"/><stop offset=".5" stop-color="#3fd6ff"/>
    <stop offset="1" stop-color="#ffcf4d"/></linearGradient>
</defs>
<rect width="1280" height="210" rx="18" fill="url(#sky)"/>
<rect width="1280" height="210" rx="18" fill="url(#grid)"/>
<g font-family="Rajdhani, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<g class="tile" style="animation-delay:0.0s">
  <rect x="20.0" y="28" width="232" height="154" rx="14" fill="#061624"
        fill-opacity="0.72" stroke="#3fd6ff" stroke-opacity=".4"/>
  <path d="M34.0 28h54" stroke="#3fd6ff" stroke-width="3" stroke-linecap="round"/>
  <text x="136.0" y="104" text-anchor="middle" font-size="58" font-weight="700"
        fill="#3fd6ff" class="num">49</text>
  <text x="136.0" y="138" text-anchor="middle" font-size="14" font-weight="700"
        letter-spacing="1.6" fill="#e8f8ff">REGULATIONS TRACKED</text>
  <text x="136.0" y="162" text-anchor="middle" font-size="14"
        fill="#7fa8bf">each awaiting counsel review</text>
</g>
<g class="tile" style="animation-delay:0.4s">
  <rect x="272.0" y="28" width="232" height="154" rx="14" fill="#061624"
        fill-opacity="0.72" stroke="#3fd6ff" stroke-opacity=".4"/>
  <path d="M286.0 28h54" stroke="#3fd6ff" stroke-width="3" stroke-linecap="round"/>
  <text x="388.0" y="104" text-anchor="middle" font-size="58" font-weight="700"
        fill="#3fd6ff" class="num">65</text>
  <text x="388.0" y="138" text-anchor="middle" font-size="14" font-weight="700"
        letter-spacing="1.6" fill="#e8f8ff">POLICY RULES</text>
  <text x="388.0" y="162" text-anchor="middle" font-size="14"
        fill="#7fa8bf">PASS · REVIEW · BLOCK</text>
</g>
<g class="tile" style="animation-delay:0.8s">
  <rect x="524.0" y="28" width="232" height="154" rx="14" fill="#061624"
        fill-opacity="0.72" stroke="#3fd6ff" stroke-opacity=".4"/>
  <path d="M538.0 28h54" stroke="#3fd6ff" stroke-width="3" stroke-linecap="round"/>
  <text x="640.0" y="104" text-anchor="middle" font-size="58" font-weight="700"
        fill="#3fd6ff" class="num">77</text>
  <text x="640.0" y="138" text-anchor="middle" font-size="14" font-weight="700"
        letter-spacing="1.6" fill="#e8f8ff">RESEARCHED TOOLS</text>
  <text x="640.0" y="162" text-anchor="middle" font-size="14"
        fill="#7fa8bf">in the toolbox, with sources</text>
</g>
<g class="tile" style="animation-delay:1.2s">
  <rect x="776.0" y="28" width="232" height="154" rx="14" fill="#061624"
        fill-opacity="0.72" stroke="#3fd6ff" stroke-opacity=".4"/>
  <path d="M790.0 28h54" stroke="#3fd6ff" stroke-width="3" stroke-linecap="round"/>
  <text x="892.0" y="104" text-anchor="middle" font-size="58" font-weight="700"
        fill="#3fd6ff" class="num">4</text>
  <text x="892.0" y="138" text-anchor="middle" font-size="14" font-weight="700"
        letter-spacing="1.6" fill="#e8f8ff">STORY FORMATS</text>
  <text x="892.0" y="162" text-anchor="middle" font-size="14"
        fill="#7fa8bf">for the kids series engine</text>
</g>
<g class="tile" style="animation-delay:1.6s">
  <rect x="1028.0" y="28" width="232" height="154" rx="14" fill="#061624"
        fill-opacity="0.72" stroke="#ffcf4d" stroke-opacity=".4"/>
  <path d="M1042.0 28h54" stroke="#ffcf4d" stroke-width="3" stroke-linecap="round"/>
  <text x="1144.0" y="104" text-anchor="middle" font-size="58" font-weight="700"
        fill="#ffcf4d" class="num">0</text>
  <text x="1144.0" y="138" text-anchor="middle" font-size="14" font-weight="700"
        letter-spacing="1.6" fill="#e8f8ff">APPROVALS BY AI</text>
  <text x="1144.0" y="162" text-anchor="middle" font-size="14"
        fill="#7fa8bf">money and legal: humans only</text>
</g>
</g>
</svg>
