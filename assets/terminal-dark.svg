<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1280 582" width="1280" height="582" role="img" aria-labelledby="t d">
<title id="t">BAU at the terminal</title>
<desc id="d">Four commands: asking the toolbox, drafting a creator batch, checking usage,
choosing the living art.</desc>
<style>
.ln { animation-duration: 22.0s; animation-iteration-count: infinite;
       animation-timing-function: linear; clip-path: inset(0 100% 0 0); white-space: pre; }
@keyframes l0 { 0%, 2.73% { clip-path: inset(0 100% 0 0); } 12.75%, 96% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
@keyframes l1 { 0%, 15.93% { clip-path: inset(0 100% 0 0); } 16.48%, 96% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
@keyframes l2 { 0%, 17.52% { clip-path: inset(0 100% 0 0); } 18.07%, 96% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
@keyframes l3 { 0%, 19.11% { clip-path: inset(0 100% 0 0); } 19.66%, 96% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
@keyframes l4 { 0%, 20.70% { clip-path: inset(0 100% 0 0); } 31.61%, 96% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
@keyframes l5 { 0%, 34.80% { clip-path: inset(0 100% 0 0); } 35.34%, 96% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
@keyframes l6 { 0%, 36.39% { clip-path: inset(0 100% 0 0); } 36.93%, 96% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
@keyframes l7 { 0%, 37.98% { clip-path: inset(0 100% 0 0); } 38.52%, 96% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
@keyframes l8 { 0%, 39.57% { clip-path: inset(0 100% 0 0); } 41.41%, 96% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
@keyframes l9 { 0%, 44.59% { clip-path: inset(0 100% 0 0); } 45.14%, 96% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
@keyframes l10 { 0%, 46.18% { clip-path: inset(0 100% 0 0); } 46.73%, 96% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
@keyframes l11 { 0%, 47.77% { clip-path: inset(0 100% 0 0); } 52.89%, 96% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
@keyframes l12 { 0%, 56.07% { clip-path: inset(0 100% 0 0); } 56.61%, 96% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
@media (prefers-reduced-motion: reduce) { .ln { animation: none !important;
       clip-path: none !important; } }
</style>
<defs>
  <radialGradient id="sky" cx="50%" cy="45%" r="75%">
    <stop offset="0" stop-color="#0b4374"/><stop offset=".55" stop-color="#03152c"/>
    <stop offset="1" stop-color="#010812"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#3fd6ff" stroke-width="1"
          opacity="0.07"/></pattern>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#3fd6ff" stop-opacity=".55"/>
    <stop offset="1" stop-color="#3fd6ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="title" x1="0" x2="1">
    <stop offset="0" stop-color="#e8f8ff"/><stop offset=".5" stop-color="#3fd6ff"/>
    <stop offset="1" stop-color="#ffcf4d"/></linearGradient>
</defs>
<rect width="1280" height="582" rx="18" fill="url(#sky)"/>
<rect width="1280" height="582" rx="18" fill="url(#grid)"/>
<rect x="24" y="22" width="1232" height="538" rx="14" fill="#061624"
      fill-opacity="0.72" stroke="#3fd6ff" stroke-opacity=".35"/>
<circle cx="52" cy="48" r="6" fill="#ff5f57"/><circle cx="74" cy="48" r="6" fill="#febc2e"/>
<circle cx="96" cy="48" r="6" fill="#28c840"/>
<text x="640.0" y="53" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="14"
      fill="#7fa8bf">bau — outputs abbreviated, sample data</text>
<g font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="19" xml:space="preserve">
<text x="48" y="92" class="ln" style="animation-name:l0" fill="#e8f8ff"><tspan fill="#3fd6ff">jarvis@cloud</tspan><tspan fill="#7fa8bf">:~$ </tspan>bau toolbox ask "stop the model making things up"</text>
<text x="48" y="126" class="ln" style="animation-name:l1" fill="#7fa8bf">DeepEval      evals            Apache-2.0   claimed</text>
<text x="48" y="160" class="ln" style="animation-name:l2" fill="#7fa8bf">Context7      docs-grounding   MIT          claimed</text>
<text x="48" y="194" class="ln" style="animation-name:l3" fill="#7fa8bf">LlamaIndex    grounding        MIT          claimed</text>
<text x="48" y="228" class="ln" style="animation-name:l4" fill="#e8f8ff"><tspan fill="#3fd6ff">jarvis@cloud</tspan><tspan fill="#7fa8bf">:~$ </tspan>bau creator batch aria.yaml "autumn city fashion" --platform instagram</text>
<text x="48" y="262" class="ln" style="animation-name:l5" fill="#7fa8bf">Identity lock: Aria Vale is a fictional 25-year-old adult virtual creator.</text>
<text x="48" y="296" class="ln" style="animation-name:l6" fill="#7fa8bf">Post 1: portrait  ·  Tier: sfw  ·  caption with AI-persona disclosure</text>
<text x="48" y="330" class="ln" style="animation-name:l7" fill="#ffcf4d">✓ 7 posts · every prompt carries the same identity lock</text>
<text x="48" y="364" class="ln" style="animation-name:l8" fill="#e8f8ff"><tspan fill="#3fd6ff">jarvis@cloud</tspan><tspan fill="#7fa8bf">:~$ </tspan>bau usage</text>
<text x="48" y="398" class="ln" style="animation-name:l9" fill="#7fa8bf">today    32,850 tokens · 9 calls · $0.00</text>
<text x="48" y="432" class="ln" style="animation-name:l10" fill="#ffcf4d">⚠ 98% of your daily token limit</text>
<text x="48" y="466" class="ln" style="animation-name:l11" fill="#e8f8ff"><tspan fill="#3fd6ff">jarvis@cloud</tspan><tspan fill="#7fa8bf">:~$ </tspan>bau look flow dusk summer</text>
<text x="48" y="500" class="ln" style="animation-name:l12" fill="#ffcf4d">✓ dusk -> summer, breathed through the glass core every 40 s</text>
</g>
</svg>
