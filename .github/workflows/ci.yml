name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' shellcheck-py
      - name: lint
        run: ruff check src tests
      - name: secret scan
        run: bau secrets .
      - name: regulation registry and policies
        run: bau reg validate
      - name: tests
        run: python -m pytest -q
      - name: shellcheck installer
        run: >-
          shellcheck -x installer/*.sh installer/lib/*.sh installer/payload/*.sh
          installer/firstboot/*.sh docker/*.sh vm/*.sh image/*.sh image/live-build/auto/config
          image/live-build/config/hooks/live/*.chroot
          image/live-build/config/includes.chroot/usr/local/sbin/bau-live-init
          image/live-build/config/includes.chroot/usr/local/bin/jarvis-setup
      - name: build payload
        run: installer/make-payload.sh --skip-tests
