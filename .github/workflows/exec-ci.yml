name: exec-ci

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ feature/executive-controller ]

permissions:
  contents: read

jobs:
  exec-tests:
    name: Executive scaffold tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install (dev)
        run: python -m pip install -q -e '.[dev]'
      - name: Lint new modules (ruff)
        run: ruff check src/bau/executive.py src/bau/adapters tests/test_executive.py || true
      - name: Run focused tests
        run: python -m pytest -q tests/test_executive.py
