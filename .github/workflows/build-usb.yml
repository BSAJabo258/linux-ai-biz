name: build-usb

# Builds both USB sticks on a GitHub-hosted runner and publishes them as a release
# (publication of this software project - within GitHub's Actions terms).
#   USB #1  bau-debian-<ver>-amd64-netinst.iso  (official Debian ISO, signature-verified, remastered)
#   USB #2  BAU-PAYLOAD-<ver>.tar.gz            (unpack onto any USB stick)
#           BAU-PAYLOAD-<ver>.iso               (the same payload as a disc image, for a VM)
# Run it from Actions > build-usb > "Run workflow", or by pushing a tag v*.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write          # create the release; nothing else

concurrency:
  group: build-usb
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xorriso gpg curl
          python -m pip install -q -e '.[dev]'
      - name: "USB #2: BAU payload (tests run first; Claude SDK bundled for offline install)"
        run: installer/make-payload.sh --with-claude --out dist
      - name: "USB #1: Debian image (official signature + checksum verified before remastering)"
        run: installer/build-usb-image.sh --out dist
      - name: "USB #2 as a disc image for virtual machines (vm/create-vm.*)"
        run: |
          ver="$(python -c 'import sys; sys.path.insert(0, "src"); import bau; print(bau.__version__)')"
          xorriso -as mkisofs -quiet -V BAU-PAYLOAD -J -R -o "dist/BAU-PAYLOAD-${ver}.iso" dist/BAU-PAYLOAD
      - name: checksums and notes
        id: meta
        run: |
          cd dist
          sha256sum bau-debian-*.iso BAU-PAYLOAD-*.tar.gz BAU-PAYLOAD-*.iso > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ver="$(python -c 'import sys; sys.path.insert(0, "../src"); import bau; print(bau.__version__)')"
          tag="usb-v${ver}-${GITHUB_SHA::7}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          {
            echo "Built from commit ${GITHUB_SHA} on $(date -u +%Y-%m-%d)."
            echo
            echo "## USB #1 - the operating system"
            echo "\`$(ls bau-debian-*.iso)\`: official Debian netinst (signature and checksum verified by the build), remastered with the BAU preseed (encrypted disk, hardening)."
            echo "Write it to a USB stick (8 GB+) with \`installer/write-usb.sh\` on Linux, or balenaEtcher / Rufus (DD mode) on Windows or Mac. The laptop needs internet during this install."
            echo
            echo "## USB #2 - BAU"
            echo "\`$(ls BAU-PAYLOAD-*.tar.gz)\`: unpack onto any USB stick; on the new system run \`sudo bash BAU-PAYLOAD/install.sh\` (works offline)."
            echo "\`$(ls BAU-PAYLOAD-*.iso)\`: the same payload as a disc image, for a test run in a virtual machine first (see vm/README.md)."
            echo "This payload is **unsigned** (CI never holds your GPG key). For production, rebuild with \`installer/make-payload.sh --sign <your key>\` and install with \`--expect-fpr\`."
            echo
            echo "## Verify before use"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo "Follow docs/INSTALL.md from Phase 0 (hardware audit and backup before wiping)."
          } > NOTES.md
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            dist/bau-debian-*.iso dist/BAU-PAYLOAD-*.tar.gz dist/BAU-PAYLOAD-*.iso dist/SHA256SUMS.txt \
            --title "BAU USB images (${{ steps.meta.outputs.tag }})" \
            --notes-file dist/NOTES.md --target "${GITHUB_SHA}"
