<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task Board · BAU</title>
<style>
/* The tablet's task board (docs/TABLET.md, the owner's ask 2026-11-24): every real job of
   every agent, moving from waiting to done as its record changes. Read only. */
:root{--bg:#080b12;--panel:#0e1420;--line:#253147;--ink:#dce7f7;--dim:#8797ae;--cyan:#3fd6ff;--violet:#a98bff;--green:#46f2a4;--amber:#ffb340;--red:#ff4d5e;--gold:#ffd166}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(1200px 600px at 50% 0,#111b2c 0,var(--bg) 55%);color:var(--ink);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body{display:flex;flex-direction:column;padding:14px 16px;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
h1{margin:0;font-size:15px;letter-spacing:.16em;text-transform:uppercase}h1 b{color:var(--cyan)}
#live{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px}
#live i{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
#live.lost i{background:var(--red);box-shadow:0 0 10px var(--red)}
#live.lost{color:var(--red)}
#totals{display:flex;gap:16px;flex-wrap:wrap;color:var(--dim);font-size:12px}
#totals b{color:var(--ink);font-size:18px;margin-right:4px}
main{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.col{display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,rgba(18,27,43,.94),rgba(10,15,24,.94));border:1px solid var(--line);border-radius:14px}
.col h2{margin:0;padding:10px 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.col[data-c="working"] h2{color:var(--violet)}.col[data-c="your review"] h2{color:var(--amber)}
.col[data-c="done"] h2{color:var(--green)}.col[data-c="stopped"] h2{color:var(--red)}
.cards{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:8px 9px;background:rgba(8,12,19,.7);transition:border-color .8s,box-shadow .8s}
.card .who{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
.card .what{margin:3px 0 6px;font-size:12px;overflow-wrap:anywhere}
.card .when{color:var(--dim);font-size:10px}
.steps{display:flex;gap:3px;margin-bottom:4px}
.steps i{flex:1;height:5px;border-radius:2px;background:var(--line)}
.steps i.done{background:var(--green)}.steps i.now{background:var(--violet);animation:pulse 1.4s ease-in-out infinite}
.steps i.waiting{background:var(--amber)}.steps i.stopped{background:var(--red)}
.card .now{color:var(--dim);font-size:11px}
.col[data-c="working"] .card{border-color:rgba(169,139,255,.5)}
.card.arrived{border-color:var(--gold);box-shadow:0 0 24px rgba(255,209,102,.35)}
.empty{color:var(--dim);font-size:12px;padding:6px 4px}
@keyframes pulse{50%{opacity:.35}}
@media(max-width:900px){main{grid-template-columns:1fr;overflow-y:auto}.col{max-height:none}.cards{overflow:visible}}
@media(prefers-reduced-motion:reduce){.steps i.now{animation:none}.card{transition:none}}
</style>
</head>
<body>
<header>
  <h1><b>BAU</b> task board</h1>
  <div id="totals"></div>
  <div id="live"><i></i><span>connecting…</span></div>
</header>
<main id="board"></main>
<script>
"use strict";
const KEY = new URLSearchParams(location.search).get("k") || "";
const NAMES = {"waiting": "Waiting", "working": "Working", "your review": "Your review",
               "done": "Done", "stopped": "Stopped"};
let seen = {};          // job id -> the column it was in last time
let first = true;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function ago(iso) {
  const t = Date.parse(iso || "");
  if (!t) return "";
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 90) return "just now";
  if (s < 5400) return Math.round(s / 60) + " min ago";
  if (s < 129600) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " days ago";
}

function card(c) {
  const d = el("div", "card");
  d.dataset.job = c.job_id;
  d.append(el("div", "who", c.agent));
  d.append(el("div", "what", c.objective));
  const steps = el("div", "steps");
  for (const s of c.steps) {
    const i = el("i", s.state);
    i.title = s.step + ": " + s.detail;
    steps.append(i);
  }
  d.append(steps);
  const now = c.steps.find(s => s.state === "now" || s.state === "waiting");
  if (now) d.append(el("div", "now", now.step + ": " + now.detail));
  d.append(el("div", "when", ago(c.updated_at)));
  if (!first && seen[c.job_id] !== undefined && seen[c.job_id] !== c.column) {
    d.classList.add("arrived");                // it just moved here: show it for a moment
    setTimeout(() => d.classList.remove("arrived"), 6000);
  }
  return d;
}

function draw(data) {
  const board = document.getElementById("board");
  board.replaceChildren();
  for (const c of data.columns) {
    const col = el("section", "col");
    col.dataset.c = c;
    const h = el("h2");
    h.append(el("span", "", NAMES[c] || c), el("span", "", String(data.counts[c] || 0)));
    const list = el("div", "cards");
    const mine = data.cards.filter(x => x.column === c);
    if (!mine.length) list.append(el("div", "empty", "nothing here"));
    for (const x of mine) list.append(card(x));
    col.append(h, list);
    board.append(col);
  }
  const totals = document.getElementById("totals");
  totals.replaceChildren();
  for (const [c, label] of [["working", "working"], ["done", "done"],
                            ["your review", "waiting for you"]]) {
    const s = el("span");
    s.append(el("b", "", String(data.counts[c] || 0)), document.createTextNode(label));
    totals.append(s);
  }
  seen = Object.fromEntries(data.cards.map(x => [x.job_id, x.column]));
  first = false;
}

async function tick() {
  const live = document.getElementById("live");
  try {
    const r = await fetch("/api/board", {headers: {"X-Jarvis-Key": KEY}, cache: "no-store"});
    if (!r.ok) throw new Error(r.status === 403 ? "wrong key" : "error " + r.status);
    draw(await r.json());
    live.classList.remove("lost");
    live.lastElementChild.textContent = "live · " + new Date().toLocaleTimeString();
  } catch (e) {
    live.classList.add("lost");
    live.lastElementChild.textContent = "lost connection (" + e.message + "): retrying";
  }
}
tick();
setInterval(tick, 5000);
</script>
</body>
</html>
