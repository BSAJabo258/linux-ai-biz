- reg_id: us-ca-arl
  jurisdiction: US-CA
  authority: California Legislature / Attorney General
  law: California Automatic Renewal Law, Bus. & Prof. Code 17600-17606, as amended by AB 2863
  legal_status: effective
  bau_status: IMPLEMENTED
  effective_date: 2025-07-01
  obligations:
    - Clear and conspicuous auto-renewal terms before the subscription is fulfilled
    - Affirmative consent to the automatic renewal terms specifically
    - Acknowledgment with terms, cancellation policy and how to cancel
    - Online cancellation available if the consumer signed up online ("click to cancel")
    - At most one save offer unless the consumer asks for more; cancel must be available at once
    - Annual reminder for subscriptions; notice before free trial over 31 days converts; notice before price changes
    - Keep consent records for 3 years or 1 year after termination, whichever is longer
  penalties: Unfair competition law remedies; goods sent without valid consent are deemed unconditional gifts
  source_url: https://leginfo.legislature.ca.gov/faces/billNavClient.xhtml?bill_id=202320240AB2863
  source_type: statute
  last_verified: 2026-10-04
  next_review: 2027-01-04
  legal_review_required: true
  verification_note: Obligations summarised from established analysis of AB 2863; confirm reminder windows against statute text.

- reg_id: us-ftc-reviews-rule
  jurisdiction: US
  authority: FTC
  law: Trade Regulation Rule on the Use of Consumer Reviews and Testimonials (16 CFR Part 465)
  legal_status: effective
  bau_status: IMPLEMENTED
  effective_date: 2024-10-21
  obligations:
    - No fake or AI-generated reviews/testimonials attributed to people who do not exist or did not have the experience
    - No buying positive or negative reviews; no undisclosed insider reviews
    - No review suppression; no fake social-media indicators (bought followers/views)
  penalties: Civil penalties per violation (up to $53,088)
  source_url: https://www.ecfr.gov/current/title-16/part-465
  source_type: final_regulation
  last_verified: 2026-10-04
  next_review: 2027-01-04
  legal_review_required: true

- reg_id: us-ftc-endorsement-guides
  jurisdiction: US
  authority: FTC
  law: Guides Concerning the Use of Endorsements and Testimonials in Advertising (16 CFR Part 255, 2023)
  legal_status: guidance
  bau_status: IMPLEMENTED
  effective_date: 2023-07-26
  obligations:
    - Disclose material connections (payment, free product, affiliate links) clearly and conspicuously
    - Endorsements must reflect honest opinions of actual users
  penalties: Enforced through FTC Act s.5
  source_url: https://www.ecfr.gov/current/title-16/part-255
  source_type: official_guidance
  last_verified: 2026-10-04
  next_review: 2027-01-04
  legal_review_required: false
