# Subscriptions, negative options, advertising claims, reviews.

- reg_id: us-ftc-act-s5
  jurisdiction: US
  authority: FTC
  law: FTC Act Section 5 (15 U.S.C. 45) - unfair or deceptive acts or practices
  legal_status: effective
  bau_status: IMPLEMENTED
  effective_date: 1914-09-26
  obligations:
    - Claims must be truthful, not misleading, and substantiated before they are made
    - AI capability claims are subject to the same substantiation standard ("AI-washing" enforcement)
    - Material terms must be clear and conspicuous
  penalties: Injunctions, redress; civil penalties where a rule or order is violated
  source_url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title15-section45
  source_type: statute
  last_verified: 2026-10-04
  next_review: 2027-01-04
  legal_review_required: true

- reg_id: us-ftc-rosca
  jurisdiction: US
  authority: FTC
  law: Restore Online Shoppers' Confidence Act (15 U.S.C. 8401-8405)
  legal_status: effective
  bau_status: IMPLEMENTED
  effective_date: 2010-12-29
  obligations:
    - Clearly and conspicuously disclose all material terms before obtaining billing information
    - Obtain express informed consent before charging
    - Provide simple mechanisms to stop recurring charges
  penalties: Civil penalties per violation (FTC Act 5(m)); e.g. Shutterstock $35M settlement (May 2026)
  source_url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title15-chapter110
  source_type: statute
  last_verified: 2026-10-04
  next_review: 2027-01-04
  legal_review_required: true
  notes: This - not the vacated click-to-cancel rule - is the federal basis of current subscription enforcement.

- reg_id: us-ftc-click-to-cancel-2024
  jurisdiction: US
  authority: FTC
  law: 2024 amendments to the Negative Option Rule (16 CFR 425) - "click-to-cancel"
  legal_status: vacated
  bau_status: MAPPED
  effective_date: 2025-07-14
  obligations:
    - (vacated) Simple cancellation at least as easy as sign-up; save-offer limits; consent recordkeeping
  penalties: None - vacated in full by the 8th Circuit on 2025-07-08 before taking effect
  source_url: https://www.ecfr.gov/current/title-16/part-425
  source_type: court_decision
  last_verified: 2026-10-04
  next_review: 2027-01-04
  legal_review_required: true
  notes: Kept so nobody cites it as current law. BAU still implements its controls voluntarily because ROSCA, state ARLs and FTC orders require substantially the same.

