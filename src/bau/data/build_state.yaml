# Spec §106 acceptance suite / §107 critical failure conditions.
# status: done (verified ON THE MACHINE by the operator) | implemented (code shipped and
# tested in CI, not yet verified on the machine) | partial | not_started.
# critical: true = spec §107 condition; it keeps the dashboard RED until done.
