agent:
  research:
    agent_id: research
    version: "1"
    purpose: Research with cited sources. Never invent a source.
    model: claude-opus-5-5
    permissions: [READ_ONLY]
    budget_usd_per_day: 5
    network_scope: allowlisted research sources
    tools: [memory.search, memory.brain, search.regulations, spatial.public_data]
    approval_policy: none (read-only)
    risk_level: LOW
    status: APPROVED
  writer:
    agent_id: writer
    version: "1"
    purpose: Draft scripts, copy and documents from verified facts only.
    model: claude-opus-5-5
    permissions: [READ_ONLY, LOW_RISK]
    budget_usd_per_day: 5
    network_scope: none
    tools: [memory.search, memory.brain, artifact.write_draft]
    approval_policy: drafts only; publication is a separate approved step
    risk_level: LOW
    status: APPROVED
  qa:
    agent_id: qa
    version: "1"
    purpose: Fact-check and quality-check drafts; list every unsupported claim.
    model: claude-opus-5-5
    permissions: [READ_ONLY]
    budget_usd_per_day: 3
    network_scope: none
    tools: [memory.search, memory.brain, search.regulations]
    approval_policy: none (read-only)
    risk_level: LOW
    status: APPROVED
  media:
    agent_id: media
    version: "1"
    purpose: Plan storyboards and edits; never publish.
    model: claude-opus-5-5
    permissions: [READ_ONLY, LOW_RISK]
    budget_usd_per_day: 5
    network_scope: none
    tools: [memory.search, memory.brain, media.analyze_audio, artifact.write_draft]
    approval_policy: drafts only
    risk_level: LOW
    status: APPROVED
