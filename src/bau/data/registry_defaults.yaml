# Default capability registry seed (copied into BAU_HOME/registry by `bau init`).
# Nothing here is trusted yet: models and providers start REGISTERED and a human
# promotes them (`bau registry set-status ...`) after reviewing terms and benchmarks.
provider:
  anthropic:
    provider_id: anthropic
    data_sent: [prompts, tool results, documents you include]
    data_retained: per Anthropic commercial terms / org retention settings
    training_on_customer_data: false
    jurisdiction: US
    commercial_rights: customer owns outputs per commercial terms (verify current terms)
    terms_url: https://www.anthropic.com/legal/commercial-terms
    dpa_signed: false
    status: REGISTERED
  higgsfield:
    # Checked 2026-10-10: docs.higgsfield.ai (API, pay per generation, failed/moderated
    # requests not charged, outputs kept 7+ days) and the help centre article "Who owns
    # my generations": the customer owns outputs, commercial use is not restricted, and
    # Higgsfield may use content to train its models while it is kept there (the licence
    # ends when the content or account is deleted). Company jurisdiction is not stated in
    # those pages. Read the Terms of Use before approving.
    provider_id: higgsfield
    data_sent: [video prompts written in BAU workspaces]
    data_retained: "generated outputs kept at least 7 days; content may be used to train Higgsfield models until deleted"
    training_on_customer_data: true (until the content or account is deleted)
    jurisdiction: not stated in the docs or help centre (check the Terms of Use)
    commercial_rights: customer owns outputs; commercial use not restricted (help centre, Terms 4.4)
    terms_url: https://higgsfield.ai/terms-of-use-agreement
    personal_data_allowed: false
    dpa_signed: false
    status: REGISTERED
  zai:
    # Checked 2026-10-07 at docs.z.ai: operated by JINGSHENG HENGXING TECHNOLOGY PTE. LTD.
    # from Singapore; the API data processing terms say API content is processed in real
    # time and not saved on their servers. Training on API content is not stated either way.
    provider_id: zai
    data_sent: [Jarvis prompts, your messages, BAU status summaries and tool results]
    data_retained: "API content processed in real time and not stored (Z.ai API terms); account and billing data kept per their privacy policy"
    training_on_customer_data: not stated for the API
    jurisdiction: SG
    commercial_rights: GLM-4.7-Flash weights are MIT; API use per Z.ai terms of use
    terms_url: https://docs.z.ai/legal-agreement/terms-of-use
    privacy_url: https://docs.z.ai/legal-agreement/privacy-policy
    dpa_signed: false
    status: REGISTERED
  nvidia:
    # Checked 2026-10-08: NVIDIA API Trial Terms of Service, v. September 19, 2025.
    # Trial use only, never in production (1.2). Content is not stored or used after the
    # session (2.3) except logs for security, fraud and abuse (2.4, 3.3). No confidential
    # information or personal data may be sent (2.6a), so personal_data_allowed is false.
    provider_id: nvidia
    data_sent: [Jarvis prompts, your messages, BAU status summaries and tool results]
    data_retained: "not stored or used after each session, except logs for security, fraud and abuse (API Trial terms 2.3-2.4)"
    training_on_customer_data: not stated; content is not used after the session (terms 2.3)
    jurisdiction: US
    commercial_rights: trial and evaluation only; production needs an NVIDIA AI Enterprise subscription
    terms_url: https://assets.ngc.nvidia.com/products/api-catalog/legal/NVIDIA%20API%20Trial%20Terms%20of%20Service.pdf
    personal_data_allowed: false
    dpa_signed: false
    status: REGISTERED
  local:
    provider_id: local
    data_sent: [nothing leaves the machine]
    data_retained: local
    training_on_customer_data: false
    jurisdiction: local
    commercial_rights: per model licence
    terms_url: https://github.com/ggml-org/llama.cpp
    status: APPROVED
