# Wi-Fi power saving off for the desktop's MediaTek MT7921 only (driver mt7921e, PCI 14c3:7961).
# The owner's desktop, 2026-10-27/28: its Wi-Fi joined, then kept dropping out. Per
# NetworkManager.conf(5) and nm-settings-nmcli(5) (networkmanager.dev, read 2026-10-28): a
# [connection*] section with match-device=driver:NAME sets defaults for that driver's devices,
# and wifi.powersave=2 is "disable". Other Wi-Fi cards (the laptop's) keep their default.
[connection-bau-mt7921]
match-device=driver:mt7921e
wifi.powersave=2
