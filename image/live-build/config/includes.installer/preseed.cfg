#### BAU preseed for the full stick: Debian's installer inside the My Jarvis live image.
#
# The installer copies the tested live system (desktop, BAU, llama.cpp) to the disk, so
# nothing large is downloaded. Partitioning, accounts, clock and boot loader are the same
# as installer/preseed/bau.preseed (tests/test_full_stick.py keeps them identical).
#
# Deliberately NOT preseeded, so a person must answer at install time:
#   * which disk to install to, and every "write changes / erase disk" confirmation
#   * the disk-encryption passphrase
#   * the administrator password (no secret ever lives in this file)
#   * the time zone
#   * which disk gets the boot loader (GRUB)

### Localisation
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network (DHCP; no inbound services are installed). Works offline too.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string bau
d-i netcfg/get_domain string localdomain
d-i netcfg/wireless_wep string

### Mirror (for later updates; the system itself comes from this stick)
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Accounts: root disabled, admin uses sudo. Password is asked interactively.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string BAU Administrator
d-i passwd/username string bauadmin
d-i passwd/user-default-groups string audio cdrom video plugdev netdev sudo

### Clock: UTC hardware clock with network time (date-aware compliance needs a correct clock)
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

### Partitioning: full-disk encryption (LUKS) + LVM, separate /home.
### The disk is NOT chosen here and NO confirmation is preseeded: the installer
### shows the target disk and you must confirm the erase yourself.
d-i partman-auto/method string crypto
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select home
d-i partman-auto-lvm/new_vg_name string bau-vg

### Apt: security updates on; nothing is downloaded during the install itself.
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/cdrom/set-first boolean false

### Software: the live system is copied as it is; no desktop is downloaded on top.
### BAU's remaining packages (podman, auditd, ...) are added by install.sh.
tasksel tasksel/first multiselect
d-i pkgsel/include string
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

### Boot loader. Where it goes is asked, never preseeded: "default" means the first disk,
### and when BAU is installed onto a USB disk the first disk can be the install stick
### (GRUB then fails). It also goes to the fallback path EFI/BOOT/BOOTX64.EFI, so a USB
### disk starts from the F12 menu on any UEFI PC.
d-i grub-installer/only_debian boolean true
d-i grub-installer/force-efi-extra-removable boolean true

### Hand-off. live-to-disk.sh removes what only the live stick needs (the encrypted-stick
### checks that keep BAU's services off), then BAU comes from /BAU-PAYLOAD on this stick:
### copied to /opt/bau-payload and every file re-checked there. A copy that does not match
### its checksums is deleted, never left for install.sh. No network access.
d-i preseed/late_command string \
  mkdir -p /target/opt/bau-bootstrap; \
  cp -r /cdrom/bau/. /target/opt/bau-bootstrap/; \
  sh /cdrom/bau/live-to-disk.sh /target; \
  if [ -d /cdrom/BAU-PAYLOAD ]; then \
    cp -r /cdrom/BAU-PAYLOAD /target/opt/bau-payload; \
    in-target /bin/sh -c 'cd /opt/bau-payload && sha256sum --quiet --strict -c SHA256SUMS' \
      || rm -rf /target/opt/bau-payload; \
  fi; \
  in-target /bin/sh /opt/bau-bootstrap/firstboot-setup.sh

d-i finish-install/reboot_in_progress note
