source /boot/grub/config.cfg

# My Jarvis boot menu. The normal entry asks for the encrypted storage passphrase.
menuentry "My Jarvis" --hotkey=j {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}
menuentry "My Jarvis - limited mode (nothing is opened or saved)" --hotkey=l {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nopersistence
	initrd	@INITRD_LIVE@
}
menuentry "My Jarvis - safe graphics (if the screen stays black)" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}
menuentry "My Jarvis - recovery (text console, no desktop)" --hotkey=r {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ systemd.unit=multi-user.target
	initrd	@INITRD_LIVE@
}

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Firmware setup (UEFI): where virtualisation and boot order are changed
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
