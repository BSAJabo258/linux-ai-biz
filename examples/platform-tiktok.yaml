# TikTok platform policy record (bau platform add examples/platform-tiktok.yaml).
# Facts below were checked on 2026-10-05 against developers.tiktok.com. Re-verify and
# bump last_verified at least every 90 days; posting is blocked once it goes stale.
platform: tiktok
policy_version: "Content Posting API v2 / Content Sharing Guidelines (checked 2026-10-05)"
ai_content_policy: >-
  AI-generated content must be labelled. The Direct Post API takes is_aigc=true, which
  applies TikTok's AI-generated content label; BAU sets it whenever provenance says AI.
copyright_policy: Only post material BAU holds rights to (IP ledger); no unlicensed clips.
music_policy: >-
  Every post shows "By posting, you agree to TikTok's Music Usage Confirmation"
  (Branded Content Policy wording when branded content is on).
advertising_policy: Paid promotion of a third party = brand_content_toggle (Branded Content).
commercial_content_policy: >-
  Own-business promotion = brand_organic_toggle; third-party paid = brand_content_toggle.
  Disclosure toggle is off by default and chosen by the owner per post. Branded content
  cannot be posted as "Only me".
api_policy: >-
  Direct Post needs scope video.publish and app audit; unaudited apps post private
  (SELF_ONLY) only. Inbox drafts use video.upload. 6 init requests/min per token;
  status fetch 30/min. mp4/mov/webm, up to 4 GB.
automation_policy: >-
  Per-post express user consent is required before upload: show the account nickname,
  a preview, privacy chosen by the user with no default (from creator_info options),
  and the music/branded confirmation. No unattended or scheduled posting.
account_limits: Video length capped by creator_info.max_video_post_duration_sec.
appeal_process: Through the TikTok app (Settings > Support) for removed posts.
requires_ai_label: true
source_url: https://developers.tiktok.com/doc/content-sharing-guidelines
last_verified: 2026-10-05
