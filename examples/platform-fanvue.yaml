# Fanvue platform policy record (bau platform add examples/platform-fanvue.yaml).
# Read 2026-11-01 on help.fanvue.com ("AI content on Fanvue: what's allowed") and
# legal.fanvue.com/acceptable-use-policy. Fields marked "not read yet" were not checked on an
# official page: read them before relying on them. Re-verify at least every 90 days.
platform: fanvue
policy_version: "Help centre 'AI content on Fanvue' + Community Guidelines Section D (read 2026-11-01)"
ai_content_policy: >-
  AI media must be disclosed clearly and prominently (profile bio, caption or watermark) and
  every AI account type shows the AI label. A fully AI account never tells fans it is a real
  person. AI characters must look clearly adult; stated ages do not override how they look. No
  real, identifiable person without verification and documented consent; no content made from
  other people's photos or videos; no copyrighted characters.
copyright_policy: Only your own work; no AI content made from other people's photos or videos; no copyrighted characters.
music_policy: not read yet
advertising_policy: not read yet
commercial_content_policy: >-
  Prices (help.fanvue.com, read 2026-11-01): subscriptions $3.99-$100 a month, $9.99-$15 does
  best on average (articles/16233102-subscription-pricing-retention-guide); a post's price
  $3-$500 (articles/7860554-how-do-i-set-a-price-for-a-post); Fanvue's guide calls $10-15 a
  sensible floor for the cheapest pay-per-view item (articles/16237634); creators keep 80%
  (articles/7860515-earning-rate-changes-for-creators-on-fanvue); free trials exist
  (articles/7860795). Not found: paid-message and tip limits, multi-month bundles.
api_policy: >-
  Read 2026-11-03 on api.fanvue.com/docs: OAuth 2.0 with PKCE (S256) only, no API keys or
  personal tokens; client_secret_basic; rotating single-use refresh tokens (offline_access).
  X-Fanvue-API-Version 2025-06-26. POST /v1/posts (write:post): audience subscribers |
  followers-and-subscribers, text <= 5000 (checked for prohibited language), price in cents
  >= 300. Media upload in parts (write:media, write:creator), attach once status is ready,
  max 1.5 GiB. Earnings GET /v1/insights/earnings (read:insights) in USD cents. 200
  requests per 60 s per client per user, 6 in flight. No API field for an AI label.
  BAU's adapter: src/bau/fanvue.py, docs/FANVUE.md.
automation_policy: not read yet
account_limits: The human behind a fully AI account completes Fanvue's ID verification (KYC).
appeal_process: not read yet
requires_ai_label: true
source_url: https://help.fanvue.com/en/articles/9538738-is-ai-content-allowed-on-fanvue
last_verified: 2026-11-01
