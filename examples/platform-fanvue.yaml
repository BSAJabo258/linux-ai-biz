# Fanvue platform policy record (bau platform add examples/platform-fanvue.yaml).
# Read 2026-11-01 on help.fanvue.com ("AI content on Fanvue: what's allowed") and
# legal.fanvue.com/acceptable-use-policy. Fields marked "not read yet" were not checked on an
# official page: read them before relying on them. Re-verify at least every 90 days.
platform: fanvue
policy_version: "Help centre 'AI content on Fanvue' + Community Guidelines Section D (read 2026-11-01)"
ai_content_policy: >-
  AI media must be disclosed clearly and prominently (profile bio, caption or watermark) and
  every AI account type shows the AI label. A fully AI account never tells fans it is a real
  person. AI characters must look clearly adult; stated ages do not override how they look. No
  real, identifiable person without verification and documented consent; no content made from
  other people's photos or videos; no copyrighted characters.
explicit_content_policy: >-
  Read 2026-11-21 on legal.fanvue.com/community-guidelines (updated 2026-10-12), section C.6:
  intimate content (nudity, sexual acts) is permitted when clearly marked 18+, except a
  non-exhaustive banned list: bestiality; choking, strangulation or asphyxiation;
  sadomasochistic abuse; hardcore bondage; genital mutilation; necrophilia; age-play; anyone
  sleeping or unconscious (or pretending); rape or non-consent role-play; "bodily fluids,
  including urination, defecation and vomit" (C.6.3.10); sex with violence or risk of harm;
  bloodplay; degradation based on a protected characteristic; incest including "step"
  scenarios; sexual activity in public places. Toys, fetish outfits and props are banned only
  from public media (profile picture, banner, intro video: SFW, section F); not otherwise
  listed. Unknown (not on the page): whether ejaculate counts under "bodily fluids"; ask
  Fanvue support in writing before relying on it.
co_authored_policy: >-
  Read 2026-11-21 on legal.fanvue.com/co-authored (updated 2026-06-22) and
  community-guidelines B.4: content featuring any person other than the uploading creator,
  "regardless of whether their identity is discernible", needs that person's government ID
  and signed, informed consent on file. The AI pages (help.fanvue.com article 9538738, updated
  2026-10-16; community-guidelines D) do not say a wholly synthetic second character is
  exempt. Unknown: whether an AI-generated second person needs this; ask Fanvue support in
  writing before posting such content. BAU makes solo content only until then.
copyright_policy: Only your own work; no AI content made from other people's photos or videos; no copyrighted characters.
music_policy: not read yet
advertising_policy: not read yet
commercial_content_policy: >-
  Prices (help.fanvue.com, read 2026-11-01): subscriptions $3.99-$100 a month, $9.99-$15 does
  best on average (articles/16233102-subscription-pricing-retention-guide); a post's price
  $3-$500 (articles/7860554-how-do-i-set-a-price-for-a-post); Fanvue's guide calls $10-15 a
  sensible floor for the cheapest pay-per-view item (articles/16237634); creators keep 80%
  (articles/7860515-earning-rate-changes-for-creators-on-fanvue); free trials exist
  (articles/7860795). Not found: paid-message and tip limits, multi-month bundles.
api_policy: >-
  Read 2026-11-03 on api.fanvue.com/docs: OAuth 2.0 with PKCE (S256) only, no API keys or
  personal tokens; client_secret_basic; rotating single-use refresh tokens (offline_access).
  X-Fanvue-API-Version 2025-06-26. POST /v1/posts (write:post): audience subscribers |
  followers-and-subscribers, text <= 5000 (checked for prohibited language), price in cents
  >= 300. Media upload in parts (write:media, write:creator), attach once status is ready,
  max 1.5 GiB. Earnings GET /v1/insights/earnings (read:insights) in USD cents. 200
  requests per 60 s per client per user, 6 in flight. No API field for an AI label.
  BAU's adapter: src/bau/fanvue.py, docs/FANVUE.md.
automation_policy: >-
  Read 2026-11-20. API chat (api.fanvue.com/docs/v1/api-reference): GET /v1/chats and
  /v1/chats/{userUuid}/messages (read:chat), POST /v1/chats/{userUuid}/message (write:chat;
  text 1-5000, price in cents >= 300 needs media), tracking links (read/write:tracking_links),
  automated welcome messages (read/write:creator); the API cannot unlock a paid message.
  Fanvue sells its own AI messaging "designed for NSFW creators"
  (help.fanvue.com/en/articles/16237836). Rules: asked "Are you AI?" / "Are you real?", answer
  yes clearly (help.fanvue.com/en/articles/17637130-ai-labels-and-disclosure); keep payments
  and contact on Fanvue; no solicitation (community guidelines C.8.1), no misleading users
  (B.1.3), no spam (B.1.4), no codewords (acceptable use policy 2.4.2), no faked live
  interactions (AUP 2.3.3). AUP 5.6 bans "bots ... automated scripts" without saying whether
  Fanvue's own API is meant. BAU's adapter: src/bau/fan_chat.py, docs/FAN-CHAT.md.
account_limits: The human behind a fully AI account completes Fanvue's ID verification (KYC).
appeal_process: not read yet
requires_ai_label: true
source_url: https://help.fanvue.com/en/articles/9538738-is-ai-content-allowed-on-fanvue
last_verified: 2026-11-01
