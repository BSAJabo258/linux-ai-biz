[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bau"
version = "0.3.0"
description = "BAU/BSA control plane: compliance-first trust, policy, evidence and installer tooling"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Debian 13 ships python3-yaml; the installer creates the venv with
# --system-site-packages so the target machine needs no network access.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
# Claude models through the official SDK (cloud provider adapter).
claude = ["anthropic"]

[project.scripts]
bau = "bau.cli:main"
jarvis-storage = "bau.live:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bau = ["data/*.yaml", "data/**/*.yaml", "data/**/*.json", "data/**/*.txt", "data/**/*.md",
       "ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# SVG markup templates read better unwrapped.
"assets/make_art.py" = ["E501"]
