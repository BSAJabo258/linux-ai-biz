[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bau"
version = "0.1.0"
description = "BAU/BSA control plane: compliance-first trust, policy, evidence and installer tooling"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Debian 13 ships python3-yaml; the installer creates the venv with
# --system-site-packages so the target machine needs no network access.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
bau = "bau.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bau = ["data/**/*.yaml", "data/**/*.json", "data/**/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
